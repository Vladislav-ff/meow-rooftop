<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEOW / CINEMATIC</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#080b19}body{overflow:hidden}#status{position:absolute;inset:0;display:grid;place-content:center;color:#c9c2e8;font:14px/1.8 Arial;padding:30px}</style></head><body><div id="status">Загружаем атмосферную версию…</div><script type="module">
try {
 const response=await fetch(new URL('./index.html',location.href),{cache:'no-cache'});
 if(!response.ok)throw new Error('HTTP '+response.status);
 let source=await response.text();
 const anchor='let clock=new T.Clock(),frame=0;';
 if(!source.includes(anchor)||!source.includes('controls.update();composer.render();'))throw new Error('Структура исходной сцены изменилась');
 const moduleURL=new URL('./atmosphere.js',location.href).href;
 source=source.replace("import * as T from 'three';",`import {installAtmosphere} from ${JSON.stringify(moduleURL)}; import * as T from 'three';`);
 source=source.replace(anchor,'const atmosphere=installAtmosphere({T,scene,camera,renderer,composer,bloom,moonLight,beams,spots,tiles,cat,steel});'+anchor);
 source=source.replace('controls.update();composer.render();','controls.update();atmosphere.update(t,high,reduced);composer.render();');
 source=source.replace('<head>','<head><base href="'+new URL('./',location.href).href+'">');
 const frame=document.createElement('iframe');frame.title='MEOW rooftop — cinematic lighting';frame.allow='autoplay; fullscreen';frame.srcdoc=source;document.body.appendChild(frame);document.getElementById('status').remove();
}catch(error){document.getElementById('status').textContent='Не удалось запустить сцену: '+error.message+'. Откройте страницу через HTTP, не file://.';console.error(error)}
</script></body></html>
