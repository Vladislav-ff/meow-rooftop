<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b19"><title>MEOW / CINEMATIC</title><style>
html,body{margin:0;width:100%;height:100%;background:#080b19;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}#status{position:fixed;inset:0;z-index:20;display:grid;place-content:center;text-align:center;background:#080b19;color:#c9c2e8;font:14px/1.8 Arial;padding:28px}h1{font-size:40px;letter-spacing:7px;color:#bcff72}#message{max-width:550px}a{color:#bcff72}.bar{height:2px;background:linear-gradient(90deg,#bcff72,#8558ff,#ff48bc);margin:15px 0}
</style></head><body><div id="status"><h1>MEOW.</h1><div class="bar"></div><div id="message" role="status">Подготавливаем свет и материалы…</div><a href="index.html">Открыть исходную версию</a></div><script type="module">
const status=document.getElementById('status'),message=document.getElementById('message');let frame,timeout;
function fail(text){clearTimeout(timeout);status.style.display='grid';message.textContent=text;window.__meowStatus='error';}
window.__meowStatus='loading';
addEventListener('message',event=>{
 if(!frame||event.source!==frame.contentWindow)return;
 if(event.data?.type==='meow-ready'){clearTimeout(timeout);status.style.display='none';window.__meowStatus='ready';}
 if(event.data?.type==='meow-error')fail('Ошибка 3D: '+event.data.message);
});
try{
 const controller=new AbortController();timeout=setTimeout(()=>controller.abort(),20000);
 const response=await fetch(new URL('./index.html',location.href),{cache:'no-cache',signal:controller.signal});
 if(!response.ok)throw new Error('HTTP '+response.status);
 let source=await response.text();clearTimeout(timeout);
 const replaceOnce=(before,after)=>{if(source.split(before).length!==2)throw new Error('Не совпадает точка интеграции: '+before.slice(0,50));source=source.replace(before,after);};
 const base=new URL('./',location.href).href;
 replaceOnce("import * as T from 'three';",`import {installAtmosphere} from ${JSON.stringify(new URL('atmosphere.js',base).href)};import {installPolish} from ${JSON.stringify(new URL('polish.js',base).href)};import * as T from 'three';`);
 replaceOnce('let clock=new T.Clock(),frame=0;',`const context={T,scene,camera,renderer,composer,bloom,moonLight,beams,spots,tiles,cat,steel};const atmosphere=installAtmosphere(context);const polish=installPolish(context);
renderer.debug.onShaderError=(gl,program,vs,fs)=>{window.__shaderFailed=true;window.parent.postMessage({type:'meow-error',message:gl.getProgramInfoLog(program)||gl.getShaderInfoLog(vs)||gl.getShaderInfoLog(fs)||'Ошибка компиляции GLSL'},'*');};
let clock=new T.Clock(),frame=0;`);
 replaceOnce('controls.update();composer.render();',`controls.update();atmosphere.update(t,high,reduced);polish.update(t,high,reduced);composer.render();if(frame===2&&!window.__shaderFailed)window.parent.postMessage({type:'meow-ready'},'*');`);
 const bridge=`<script>addEventListener('error',e=>parent.postMessage({type:'meow-error',message:e.message||'Не удалось загрузить ресурс'},'*'));addEventListener('unhandledrejection',e=>parent.postMessage({type:'meow-error',message:String(e.reason)},'*'));<`+'/script>';
 replaceOnce('<head>','<head><base href="'+base+'">'+bridge);
 frame=document.createElement('iframe');frame.title='MEOW rooftop cinematic';frame.allow='autoplay; fullscreen';frame.srcdoc=source;document.body.appendChild(frame);
 timeout=setTimeout(()=>fail('Сцена не подтвердила запуск за 45 секунд. Проверьте доступность CDN и поддержку WebGL2.'),45000);
}catch(error){fail('Не удалось запустить сцену: '+error.message+'. Используйте HTTP-сервер, не file://.');console.error(error);}
</script></body></html>
