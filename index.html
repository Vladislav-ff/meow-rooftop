let ac,master,on=false,timer,next=0,step=0;function sequencer(){while(on&&next<ac.currentTime+.12){let t=next;if(step%4===0){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(44,t+.18);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.26);o.connect(g).connect(master);o.start(t);o.stop(t+.28)}if(step%2===0){let b=ac.createBuffer(1,2400,ac.sampleRate),data=b.getChannelData(0);for(let j=0;j<data.length;j++)data[j]=(Math.random()*2-1)*Math.exp(-j/260);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=7500;g.gain.value=step%4===2?.13:.05;s.connect(f).connect(g).connect(master);s.start(t);let o=ac.createOscillator(),env=ac.createGain(),lp=ac.createBiquadFilter();o.type='sawtooth';o.frequency.value=[55,55,65.406,49,55,82.407,65.406,49][Math.floor(step/2)%8];lp.frequency.value=350;env.gain.setValueAtTime(.001,t);env.gain.linearRampToValueAtTime(.12,t+.015);env.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(lp).connect(env).connect(master);o.start(t);o.stop(t+.2)}next+=60/128/4;step=(step+1)%32}}document.getElementById('audio').onclick=async function(){try{if(!ac){ac=new AudioContext();master=ac.createGain();let c=ac.createDynamicsCompressor();master.connect(c).connect(ac.destination)}await ac.resume();on=!on;this.textContent='ЗВУК: '+(on?'ON':'OFF');this.classList.toggle('active',on);master.gain.setTargetAtTime(on?.4:0,ac.currentTime,.04);if(on){next=ac.currentTime+.04;timer=setInterval(sequencer,25)}else clearInterval(timer)}catch(e){this.textContent='АУДИО НЕДОСТУПНО';console.error(e)}};
const views=[[[34,27,43],[0,2,-2]],[[7.6,7.2,.5],[0,3.9,-10]], [[-11,6,13],[0,3,-7]]];let transition=null;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(a=>a.classList.toggle('active',a===b));let v=views[+b.dataset.view];transition={a:camera.position.clone(),b:new T.Vector3(...v[0]),c:controls.target.clone(),d:new T.Vector3(...v[1]),time:performance.now()}});controls.addEventListener('start',()=>transition=null);let mode=0;document.getElementById('light').onclick=function(){mode=(mode+1)%3;this.textContent='СВЕТ: '+['NEON','ACID','AFTER'][mode];let a=[0xff48bc,0xbcff72,0x8558ff][mode],b=[0x55dfff,0x55dfff,0xffae70][mode];beams.forEach((p,i)=>p.children[1].material.color.setHex(i%2?b:a));spots.forEach((s,i)=>s.color.setHex(i%2?b:a))};let high=true;document.getElementById('quality').onclick=function(){high=!high;this.textContent=high?'HQ':'LITE';renderer.setPixelRatio(Math.min(devicePixelRatio,high?1.6:1));composer.setPixelRatio(renderer.getPixelRatio());bloom.enabled=high};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn(e)}};addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('hidden')});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();const el=document.getElementById('loading');el.style.display='grid';el.style.opacity=1;document.getElementById('msg').textContent='Графический контекст потерян. Перезагрузите страницу.'});
let clock=new T.Clock(),frame=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime(),beat=t*128/60,pulse=(Math.sin(beat*Math.PI*2)+1)/2;if(transition){let k=Math.min(1,(performance.now()-transition.time)/1700);k=k*k*(3-2*k);camera.position.lerpVectors(transition.a,transition.b,k);controls.target.lerpVectors(transition.c,transition.d,k);if(k===1)transition=null}if(!reduced){head.rotation.z=Math.sin(beat*Math.PI)*.1;head.rotation.x=Math.sin(beat*Math.PI*2)*.04;paws.forEach((a,i)=>{a.rotation.x=Math.sin(t*2+i)*.13;a.rotation.z=Math.sin(t*1.5+i)*.12});tail.rotation.y=Math.sin(t*1.2)*.15;discs.forEach(d=>d.rotation.y=t*1.8);guests.forEach(({g,arms,phase},i)=>{g.position.y=.25+Math.max(0,Math.sin(beat*6.28+phase))*.065;g.rotation.z=Math.sin(beat*3.14+phase)*.065;arms.forEach((a,j)=>{a.rotation.x=Math.sin(beat*3.14+phase+j)*.4;a.rotation.z=(j?1:-1)*(.7+Math.sin(t*1.7+phase)*.8)})});beams.forEach((p,i)=>{p.rotation.z=Math.sin(t*.3+i*.7)*.7;p.rotation.x=.3+Math.sin(t*.2+i)*.5})}bars.forEach((b,i)=>{let h=.2+Math.pow((Math.sin(i*.5+t*2)+Math.sin(i*.3-t*3)+2)/4,2)*2;b.scale.y=h;b.position.y=1.9+h/2});if(frame%4===0)tiles.forEach((tile,i)=>tile.material.emissiveIntensity=reduced?.12:.07+(Math.sin(i*.6-beat*1.4)>.8?.36:0));spots.forEach(s=>s.intensity=reduced?170:145+pulse*40);controls.update();composer.render();frame++}animate();setTimeout(()=>{let el=document.getElementById('loading');el.style.opacity=0;setTimeout(()=>el.style.display='none',800)},400);
